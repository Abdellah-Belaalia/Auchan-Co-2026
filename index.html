<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header class="en-tete sticky top-0 z-50 bg-white shadow-sm">
      <div class="flex justify-between items-center py-6 px-4 md:px-8">
        <div id="menu" class="flex items-center gap-4">
          <button id="menuBtn" type="button" class="w-6">
            <img
              src="assets/icons/hamburger-menu.png"
              alt="menu"
              class="w-full"
            />
          </button>

          <div id="logo" class="py-1">
            <a href="index.html"
              ><img
                src="assets/Auchan-Logo.png"
                alt="logo"
                class="w-16 h-auto md:hidden" /><img
                src="assets/Auchan-Logo-large.png"
                alt="logo"
                class="hidden w-40 h-auto md:block"
            /></a>
          </div>
        </div>
      </div>
    </header>

    <div id="background" class="hidden fixed inset-0 bg-black/40 z-40"></div>

    <aside
      id="sidebar"
      class="hidden fixed top-0 left-0 h-full w-64 bg-white shadow-lg z-50 p-5"
    >
      <button
        id="closeBtn"
        class="w-10 h-12 rounded-lg p-2 mb-8 text-2xl font-bold text-white text-center bg-red-500 hover:bg-red-300"
      >
        X
      </button>

      <nav class="flex flex-col gap-4">
        <a href="index.html" class="hover:text-red-300">Catalogue</a>
        <a href="admin.html" class="hover:text-red-300">Administrateur</a>
        <a href="#Contact" class="hover:text-red-300">Contactez-nous</a>
      </nav>
    </aside>

    <main id="main">
      <section class="px-2 py-6 flex flex-col justify-center items-center gap-2 md:flex md:justify-between lg:flex m-4 lg:flex-row lg:justify-between">
        <div class="flex w-fit gap-2 h-auto py-1 lg:w-80 justify-between">
          <form>
            <input
              type="text"
              id="searchBarre"
              class="bg-gray-100 rounded-lg py-2 w-72"
            />
          </form>
          <button type="button" class="w-5">
            <img src="assets/icons/recherche.png" alt="recherche logo" />
          </button>
        </div>
        <div class="w-52 lg:w-80">
          <select
            id="categorieFilter"
            class="border rounded-lg text-center w-full h-12"
          >
            <option value="all">Toutes les catégories</option>
            <option value="Produits laitiers">Produits laitiers</option>
            <option value="Épicerie">Épicerie</option>
            <option value="Boissons">Boissons</option>
            <option value="Pâtes et céréales">Pâtes et céréales</option>
            <option value="Légumineuses">Légumineuses</option>
          </select>
        </div>
      </section>

      <section>
        <div class="">
          <div
            id="products"
            class="grid grid-cols-1 gap-2 p-2 m-2 md:grid-cols-2 lg:grid-cols-4"
          ></div>
        </div>
        <div class="flex justify-between items-center">
          <button id="preBtn" class="bg-red-200 rounded-md pl-2 pr-2 m-2">
            <-
          </button>
          <span
            id="curPage"
            class="border-red-100 border-2 rounded-md w-6 text-center"
            >1</span
          >
          <button id="svtBtn" class="bg-red-200 rounded-md pl-2 pr-2 m-2">
            ->
          </button>
        </div>
      </section>
    </main>

    <footer></footer>

    <script type="module" src="js/main.js" defer></script>
  </body>
</html>
