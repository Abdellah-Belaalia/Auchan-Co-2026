<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header class="en-tete">
      <div class="flex justify-around items-center border rounded">
        <div id="logo" class="py-1">
          <a href="index.html"
            ><img
              src="assets/Auchan-Logo.png"
              alt="logo"
              class="w-16 h-auto md:hidden" /><img
              src="assets/Auchan-Logo-large.png"
              alt="logo"
              class="hidden w-48 h-auto md:block"
          /></a>
        </div>
        <div class="flex">
          <button type="button">
            <img
              src="assets/icons/recherche.png"
              alt="recherche logo"
              class="w-5"
            />
          </button>
          <form>
            <input type="text" class="rounded-lg" />
          </form>
        </div>
        <div id="menu" class="py-1">
          <a href="#Catalogue">Catalogue</a>
          <a href="#Promotion">Promotion</a>
          <a href="#Administrateur">Administrateur</a>
        </div>
        <div id="barre" class="bg-red-500 block">
          <i class="fa fa-bars"></i>
        </div>
      </div>
    </header>

    <main>
      <section>
        <div class="p-2 m-2">
          <select name="all" id="all">
            <option value="all">Toutes les catégories</option>
            <option value="test1">coffee</option>
            <option value="test2">lait</option>
          </select>
        </div>
      </section>

      <section>
        <div class="">
          <div
            id="products"
            class="grid grid-cols-1 gap-2 p-2 m-2 md:grid-cols-2 lg:grid-cols-4"
          ></div>
        </div>
        <div class="flex justify-between items-center">
          <button id="preBtn" class="bg-red-200 rounded-md pl-2 pr-2 m-2"><-</button>
          <span id="curPage" class="border-red-100 border-2 rounded-md w-6 text-center">1</span>
          <button id="svtBtn" class="bg-red-200 rounded-md pl-2 pr-2 m-2">-></button>
        </div>
      </section>
    </main>

    <footer></footer>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
