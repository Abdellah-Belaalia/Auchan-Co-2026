<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header class="en-tete sticky top-0 z-50 bg-white">
      <div class="flex justify-between items-center py-6 px-4 border rounded">
        <div id="logo" class="py-1">
          <a href="index.html"
            ><img
              src="assets/Auchan-Logo.png"
              alt="logo"
              class="w-16 h-auto md:hidden" /><img
              src="assets/Auchan-Logo-large.png"
              alt="logo"
              class="hidden w-48 h-auto md:block"
          /></a>
        </div>
        <div class="py-1 pr-1">
          <button id="panier" type="click">
            <img src="assets/icons/panier.png" alt="panier" class="w-8" />
          </button>
        </div>
        <div id="menu" class="py-1">
          <button type="button" class="w-5">
            <img src="assets/icons/hamburger-menu.png" alt="recherche logo"/>
          </button>
          <div class="hidden">
            <a href="#Catalogue">Catalogue</a>
            <a href="#Administrateur">Administrateur</a>
            <a href="#Contact">Contactez-nous</a>
          </div>
        </div>
      </div>
    </header>

    <main id="main">
      <section class="px-2 py-6">
        <div  class="flex w-fit gap-2 h-auto py-1">
          <form>
            <input type="text" id="searchBarre" class="bg-gray-100 rounded-lg py-2" />
          </form>
          <button type="button" class="w-5">
            <img src="assets/icons/recherche.png" alt="recherche logo" />
          </button>
        </div>
        <div>
          <select  id="categorieFilter" class="border rounded-lg w-44 text-center">
            <option value="all">Toutes les catégories</option>
            <option value="test1">coffee</option>
            <option value="test2">lait</option>
          </select>
        </div>
      </section>

      <section>
        <div class="">
          <div
            id="products"
            class="grid grid-cols-1 gap-2 p-2 m-2 md:grid-cols-2 lg:grid-cols-4"
          ></div>
        </div>
        <div class="flex justify-between items-center">
          <button id="preBtn" class="bg-red-200 rounded-md pl-2 pr-2 m-2">
            <-
          </button>
          <span
            id="curPage"
            class="border-red-100 border-2 rounded-md w-6 text-center"
            >1</span
          >
          <button id="svtBtn" class="bg-red-200 rounded-md pl-2 pr-2 m-2">
            ->
          </button>
        </div>
      </section>
    </main>

    <footer></footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
