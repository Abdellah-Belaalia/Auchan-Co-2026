<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrateur</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-gray-50 text-gray-600">
    <header class="en-tete sticky top-0 z-50 bg-white shadow-sm">
      <div class="flex justify-between items-center py-6 px-4 md:px-8">
        <div id="menu" class="flex items-center gap-4">
          <button id="menuBtn" type="button" class="w-6">
            <img
              src="assets/icons/hamburger-menu.png"
              alt="menu"
              class="w-full"
            />
          </button>

          <div id="logo" class="py-1">
            <a href="index.html"
              ><img
                src="assets/Auchan-Logo.png"
                alt="logo"
                class="w-16 h-auto md:hidden" /><img
                src="assets/Auchan-Logo-large.png"
                alt="logo"
                class="hidden w-40 h-auto md:block"
            /></a>
          </div>
        </div>
      </div>
    </header>

    <div id="background" class="hidden fixed inset-0 bg-black/40 z-40"></div>

    <aside
      id="sidebar"
      class="hidden fixed top-0 left-0 h-full w-64 bg-white shadow-lg z-50 p-5"
    >
      <button
        id="closeBtn"
        class="w-10 h-12 rounded-lg p-2 mb-8 text-2xl font-bold text-white text-center bg-red-500 hover:bg-red-300"
      >
        X
      </button>

      <nav class="flex flex-col gap-4">
        <a href="index.html" class="hover:text-red-300">Catalogue</a>
        <a href="admin.html" class="hover:text-red-300">Administrateur</a>
        <a href="contact.html" class="hover:text-red-300">Contactez-nous</a>
      </nav>
    </aside>

    <main class="px-4 py-8 md:px-8 md:py-12">
      <section class="max-w-xl mx-auto">
        <h2 class="text-xl md:text-2xl font-bold m-6">Ajouter un produit</h2>
        <form class="bg-white border rounded-xl p-5 md:p-8 flex flex-col gap-5">
          <div class="flex flex-col gap-2">
            <label for="titre" class="font-bold">Titre</label>
            <input
              type="text"
              id="titre"
              placeholder="Nom du produit"
              class="w-full border rounded-lg p-3"
            />
            <p id="erreurTitre" class="text-red-500"></p>
          </div>
          <div class="flex flex-col gap-2">
            <label for="categories" class="font-bold">Catégories</label>
            <input
              type="text"
              id="categories"
              placeholder="Produits laitiers, Épicerie, Boissons, Légumineuses"
              class="w-full border rounded-lg p-3"
            />
            <p id="erreurCategories" class="text-red-500"></p>
          </div>
          <div class="flex flex-col gap-2">
            <label for="price" class="font-bold">Prix</label>
            <input
              type="text"
              id="price"
              placeholder="0.00"
              class="w-full border rounded-lg p-3"
            />
            <p id="erreurPrice" class="text-red-500"></p>
          </div>
          <div class="flex flex-col gap-2">
            <label for="img" class="font-bold">Image</label>
            <input
              type="text"
              id="img"
              placeholder="https://..."
              class="w-full border rounded-lg p-3"
            />
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
